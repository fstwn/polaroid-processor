[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polaroid-processor"
version = "0.2.0"
description = "Detect, crop and rectify high-resolution flatbed scans of instant prints."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "tifffile>=2023.7",
    "imagecodecs>=2024.1",  # tifffile uses it for a faster TIFF zlib encoder; same pixels
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
polaroid = "polaroid_processor.cli:main"
polaroid-mcp = "polaroid_processor.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polaroid_processor.review" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scans: needs the real scans in input/ (skipped when absent)",
]
